<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Seas — New Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --hull:      #0B2436;   /* deep navy */
    --hull-2:    #123449;
    --brass:     #C9A961;   /* accent */
    --brass-dim: #A98A4D;
    --rust:      #B5502E;   /* warnings */
    --linen:     #F6F3EC;   /* page bg */
    --paper:     #FFFFFF;
    --ink:       #16242D;
    --slate:     #64798A;
    --line:      #E4DFD3;
    --ok:        #2E6E52;
    --ok-bg:     #E7F1EA;
    --err-bg:    #F7E9E2;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--linen);
    color: var(--ink);
    min-height: 100vh;
  }
  .hero {
    background: linear-gradient(160deg, var(--hull) 0%, var(--hull-2) 100%);
    padding: 40px 24px 0;
    position: relative;
  }
  .hero-inner {
    max-width: 640px;
    margin: 0 auto;
    padding-bottom: 34px;
  }
  .hero .eyebrow {
    color: var(--brass);
    font-size: 13px;
    letter-spacing: 0.03em;
    margin: 0 0 10px;
    font-weight: 500;
  }
  .hero h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.15;
    color: #FBFAF7;
    margin: 0;
  }
  .hero p.sub {
    color: #9FB3C2;
    font-size: 14.5px;
    margin: 10px 0 0;
    max-width: 46ch;
  }
  .wave {
    display: block;
    width: 100%;
    height: 34px;
    margin-top: -1px;
  }
  main {
    max-width: 640px;
    margin: -6px auto 0;
    padding: 0 24px 70px;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 22px 24px;
    margin-top: 20px;
    box-shadow: 0 1px 2px rgba(11,36,54,0.04), 0 8px 24px -12px rgba(11,36,54,0.10);
  }
  .card h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
    margin: 0 0 16px;
  }
  .card h2 .count {
    color: var(--brass-dim);
    font-weight: 500;
  }
  label {
    display: block;
    font-size: 12.5px;
    color: var(--slate);
    margin-bottom: 7px;
    font-weight: 500;
  }
  input[type="text"], input[type="tel"] {
    width: 100%;
    padding: 12px 13px;
    border: 1.5px solid var(--line);
    border-radius: 9px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: var(--linen);
    transition: border-color .15s ease, background .15s ease;
  }
  input::placeholder { color: #9AA8AF; }
  input:focus {
    outline: none;
    border-color: var(--brass-dim);
    background: var(--paper);
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .search-wrap { position: relative; }
  #productResults {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    max-height: 260px;
    overflow-y: auto;
    box-shadow: 0 14px 30px -10px rgba(11,36,54,0.22);
    z-index: 5;
    display: none;
  }
  .result-item {
    padding: 12px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .result-item:last-child { border-bottom: none; }
  .result-item:hover { background: var(--linen); }
  .result-item .name { font-size: 14.5px; font-weight: 500; }
  .result-item .stock {
    font-size: 11.5px;
    color: var(--slate);
    background: var(--linen);
    padding: 3px 8px;
    border-radius: 20px;
  }
  .result-item .stock.low { color: var(--rust); background: var(--err-bg); }
  .cart-empty {
    text-align: center;
    color: var(--slate);
    font-size: 14px;
    padding: 22px 0;
  }
  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .cart-item:last-child { border-bottom: none; }
  .cart-item .name { flex: 1; font-size: 14.5px; font-weight: 500; }
  .qty-ctrl {
    display: flex;
    align-items: center;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .qty-ctrl button {
    width: 30px; height: 30px;
    border: none;
    background: var(--linen);
    font-size: 16px;
    cursor: pointer;
    color: var(--hull);
    font-family: 'Inter', sans-serif;
  }
  .qty-ctrl button:hover { background: #ECE6D8; }
  .qty-ctrl span { width: 30px; text-align: center; font-size: 14px; font-weight: 600; }
  .cart-item .remove {
    border: none;
    background: none;
    color: var(--rust);
    font-size: 12.5px;
    cursor: pointer;
    padding: 4px 6px;
    font-family: 'Inter', sans-serif;
  }
  .submit-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: var(--hull);
    color: #FBFAF7;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    margin-top: 20px;
    transition: background .15s ease, transform .1s ease;
  }
  .submit-btn:hover:not(:disabled) { background: var(--hull-2); }
  .submit-btn:active:not(:disabled) { transform: scale(0.99); }
  .submit-btn:disabled { background: #C7CDD1; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    padding: 13px 15px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 500;
    display: none;
  }
  .status.ok { display: block; background: var(--ok-bg); color: var(--ok); }
  .status.err { display: block; background: var(--err-bg); color: var(--rust); }
  .hint { font-size: 12.5px; color: var(--slate); margin-top: 8px; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.015); } 100% { transform: scale(1); } }
  .card.pop { animation: pop .25s ease; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <p class="eyebrow">Seven Seas Boats &amp; Ships Trading</p>
    <h1>New order</h1>
    <p class="sub">Log a sale at the counter — stock updates the moment you submit.</p>
  </div>
  <svg class="wave" viewBox="0 0 640 34" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,18 C 80,34 160,2 240,16 C 320,30 400,4 480,14 C 560,24 600,10 640,18 L640,34 L0,34 Z" fill="#F6F3EC"/>
  </svg>
</div>

<main>
  <div class="card">
    <h2>Cashier &amp; customer</h2>
    <div class="row">
      <div>
        <label for="cashierName">Cashier name</label>
        <input type="text" id="cashierName" placeholder="e.g. Ahmed">
      </div>
      <div>
        <label for="customerPhone">Customer phone</label>
        <input type="tel" id="customerPhone" placeholder="05xxxxxxxx">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Add products</h2>
    <div class="search-wrap">
      <label for="productSearch">Search product</label>
      <input type="text" id="productSearch" placeholder="Type a product name…" autocomplete="off">
      <div id="productResults"></div>
    </div>
    <p class="hint" id="loadHint">Loading product list…</p>
  </div>

  <div class="card" id="cartCard">
    <h2>Order <span class="count">(<span id="cartCount">0</span> item<span id="cartPlural">s</span>)</span></h2>
    <div id="cartList"><div class="cart-empty">No products added yet</div></div>
    <button class="submit-btn" id="submitBtn" disabled>Submit order</button>
    <div class="status" id="statusBox"></div>
  </div>
</main>

<script>
// ===================== CONFIG =====================
// Replace these with your real n8n webhook URLs once the workflow is live.
const PRODUCTS_ENDPOINT = "https://norvelle.app.n8n.cloud/webhook/seven-seas-products";
const SUBMIT_ENDPOINT   = "https://YOUR-N8N-DOMAIN/webhook/seven-seas-submit-order";
// ====================================================

let products = [];
let cart = {}; // { productName: { sku, qty, stock } }

const searchInput = document.getElementById('productSearch');
const resultsBox = document.getElementById('productResults');
const cartList = document.getElementById('cartList');
const cartCard = document.getElementById('cartCard');
const cartCount = document.getElementById('cartCount');
const cartPlural = document.getElementById('cartPlural');
const submitBtn = document.getElementById('submitBtn');
const statusBox = document.getElementById('statusBox');
const loadHint = document.getElementById('loadHint');

async function loadProducts() {
  try {
    const res = await fetch(PRODUCTS_ENDPOINT);
    if (!res.ok) throw new Error('bad response');
    products = await res.json();
    loadHint.textContent = products.length + ' products loaded';
  } catch (e) {
    loadHint.textContent = 'Could not load products — check the webhook URL in the page config.';
  }
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { resultsBox.style.display = 'none'; return; }
  const matches = products.filter(p => p.name.toLowerCase().includes(q)).slice(0, 8);
  if (!matches.length) {
    resultsBox.innerHTML = '<div class="result-item"><span class="name">No matches</span></div>';
    resultsBox.style.display = 'block';
    return;
  }
  resultsBox.innerHTML = matches.map(p => {
    const low = p.stock <= 5;
    return `<div class="result-item" data-name="${p.name}">
      <span class="name">${p.name}</span>
      <span class="stock ${low ? 'low' : ''}">${p.stock} in stock</span>
    </div>`;
  }).join('');
  resultsBox.style.display = 'block';
});

resultsBox.addEventListener('click', (e) => {
  const item = e.target.closest('.result-item');
  if (!item || !item.dataset.name) return;
  const p = products.find(x => x.name === item.dataset.name);
  if (!p) return;
  if (cart[p.name]) {
    if (cart[p.name].qty < p.stock) cart[p.name].qty += 1;
  } else {
    cart[p.name] = { sku: p.sku, qty: 1, stock: p.stock };
  }
  searchInput.value = '';
  resultsBox.style.display = 'none';
  renderCart(true);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) resultsBox.style.display = 'none';
});

function renderCart(justAdded) {
  const names = Object.keys(cart);
  cartCount.textContent = names.reduce((sum, n) => sum + cart[n].qty, 0);
  cartPlural.textContent = cartCount.textContent === '1' ? '' : 's';

  if (!names.length) {
    cartList.innerHTML = '<div class="cart-empty">No products added yet</div>';
    submitBtn.disabled = true;
    return;
  }

  cartList.innerHTML = names.map(name => {
    const item = cart[name];
    return `<div class="cart-item" data-name="${name}">
      <span class="name">${name}</span>
      <div class="qty-ctrl">
        <button class="dec" type="button">−</button>
        <span>${item.qty}</span>
        <button class="inc" type="button">+</button>
      </div>
      <button class="remove" type="button">Remove</button>
    </div>`;
  }).join('');
  submitBtn.disabled = false;

  if (justAdded) {
    cartCard.classList.remove('pop');
    void cartCard.offsetWidth;
    cartCard.classList.add('pop');
  }
}

cartList.addEventListener('click', (e) => {
  const row = e.target.closest('.cart-item');
  if (!row) return;
  const name = row.dataset.name;
  const item = cart[name];
  if (e.target.classList.contains('inc')) {
    if (item.qty < item.stock) item.qty += 1;
  } else if (e.target.classList.contains('dec')) {
    item.qty -= 1;
    if (item.qty <= 0) delete cart[name];
  } else if (e.target.classList.contains('remove')) {
    delete cart[name];
  }
  renderCart(false);
});

submitBtn.addEventListener('click', async () => {
  const cashierName = document.getElementById('cashierName').value.trim();
  const customerPhone = document.getElementById('customerPhone').value.trim();
  const items = Object.keys(cart).map(name => ({
    productName: name,
    sku: cart[name].sku,
    quantity: cart[name].qty
  }));

  if (!cashierName || !customerPhone) {
    showStatus('Please fill in cashier name and customer phone.', false);
    return;
  }
  if (!items.length) {
    showStatus('Add at least one product.', false);
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting…';

  try {
    const res = await fetch(SUBMIT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cashierName,
        customerPhone,
        items,
        timestamp: new Date().toISOString()
      })
    });
    if (!res.ok) throw new Error('submit failed');
    showStatus('Order submitted — inventory updated.', true);
    cart = {};
    renderCart(false);
    document.getElementById('cashierName').value = '';
    document.getElementById('customerPhone').value = '';
    await loadProducts(); // refresh stock numbers
  } catch (e) {
    showStatus('Could not submit the order. Check the connection and try again.', false);
  } finally {
    submitBtn.textContent = 'Submit order';
    submitBtn.disabled = Object.keys(cart).length === 0;
  }
});

function showStatus(msg, ok) {
  statusBox.textContent = msg;
  statusBox.className = 'status ' + (ok ? 'ok' : 'err');
  setTimeout(() => { statusBox.className = 'status'; }, 4000);
}

loadProducts();
</script>

</body>
</html>
