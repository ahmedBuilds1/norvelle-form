<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norvelle — Timesheet Report</title>
<style>
  :root{
    --bg: #0F1420;
    --panel: #171D2E;
    --panel-border: #262E44;
    --field-bg: #0F1420;
    --text: #E7EAF2;
    --text-dim: #8891A7;
    --accent: #4F7CFF;
    --accent-dim: rgba(79,124,255,0.14);
    --ok: #35C293;
    --err: #F0555A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif;
    color: var(--text);
  }
  .filters-bar{
    position:sticky;
    top:0;
    z-index:50;
    background: var(--panel);
    border-bottom:1px solid var(--panel-border);
    padding:16px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:end;
  }
  .filter-field{ display:flex; flex-direction:column; gap:6px; min-width:140px; }
  .filter-field label{
    font-size:11px; font-weight:600; color: var(--text-dim);
    text-transform:uppercase; letter-spacing:.04em;
  }
  input, select{
    padding:9px 10px;
    background: var(--field-bg);
    border: 1px solid var(--panel-border);
    border-radius:8px;
    color: var(--text);
    font-family:inherit;
    font-size:13px;
  }
  input:focus, select:focus{ outline:none; border-color: var(--accent); }
  .suggestion-item{
    padding:9px 10px;
    font-size:13px;
    cursor:pointer;
    color: var(--text);
  }
  .suggestion-item:hover{ background: var(--accent-dim); color: var(--accent); }
  .content{ max-width:900px; margin:0 auto; padding:24px 20px 60px; }
  .summary-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    margin-bottom:24px;
  }
  .summary-card{
    background: var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:18px;
    text-align:center;
  }
  .summary-card .label{ font-size:12px; color: var(--text-dim); margin-bottom:6px; }
  .summary-card .value{ font-size:22px; font-weight:700; }
  h2{ font-size:14px; font-weight:700; margin:24px 0 10px; color: var(--text-dim); text-transform:uppercase; letter-spacing:.04em; }
  .group-card{
    background: var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .group-header{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 16px; cursor:pointer;
  }
  .group-header:hover{ background: var(--accent-dim); }
  .group-name{ font-weight:600; font-size:14px; }
  .group-totals{ font-size:13px; color: var(--text-dim); }
  .group-detail{ display:none; padding:0 16px 12px; }
  .group-detail.open{ display:block; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; padding:6px 4px; color: var(--text-dim); font-weight:600; border-bottom:1px solid var(--panel-border); }
  td{ padding:7px 4px; border-bottom:1px solid rgba(255,255,255,0.04); }
  .empty{ text-align:center; color: var(--text-dim); padding:30px; font-size:13px; }
  .loading{ text-align:center; color: var(--text-dim); padding:30px; font-size:13px; }
  body.locked > .filters-bar, body.locked > .content{ display:none; }
  .gate{
    position:fixed;
    inset:0;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:16px;
  }
  .gate-box{
    width:100%;
    max-width:320px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:28px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    text-align:center;
  }
  .gate-box .brand{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color: var(--accent);
    font-weight:600;
    margin-bottom:6px;
  }
  .gate-box h2{
    font-size:17px;
    margin:0 0 18px;
    font-weight:650;
  }
  .gate-box input{
    text-align:center;
    letter-spacing:.1em;
    margin-bottom:8px;
  }
  .gate-box button{
    width:100%;
    margin-top:6px;
    padding:11px;
    border:none;
    border-radius:8px;
    background: var(--accent);
    color: #fff;
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
    }
  #gateError{
    color: var(--err);
    font-size:12px;
    margin-top:10px;
    min-height:16px;
    font-weight:600;
  }
</style>
</head>
<body class="locked">

<div class="gate" id="gate">
  <div class="gate-box">
    <div class="brand">Norvelle</div>
    <h2>Timesheet Report — Access</h2>
    <input type="password" id="gatePassword" placeholder="Enter access code" onkeydown="if(event.key==='Enter') checkGate()">
    <button onclick="checkGate()">Unlock</button>
    <div id="gateError"></div>
  </div>
</div>

<div class="filters-bar">
  <div class="filter-field" style="position:relative;">
    <label>Employee</label>
    <div id="employeeChips" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;"></div>
    <input type="text" id="employeeFilter" autocomplete="off" placeholder="All employees" readonly onclick="toggleEmployeeSuggestions()">
    <div id="employeeSuggestions" style="display:none; position:absolute; top:100%; left:0; right:0; z-index:60; background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; max-height:200px; overflow-y:auto; margin-top:4px; box-shadow:0 16px 40px rgba(0,0,0,0.45);"></div>
  </div>

  <div class="filter-field" style="position:relative;">
    <label>Project</label>
    <div id="projectChips" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;"></div>
    <input type="text" id="projectFilter" autocomplete="off" placeholder="All projects">
    <div id="projectSuggestions" style="display:none; position:absolute; top:100%; left:0; right:0; z-index:60; background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; max-height:200px; overflow-y:auto; margin-top:4px; box-shadow:0 16px 40px rgba(0,0,0,0.45);"></div>
  </div>

  <div class="filter-field">
    <label>From</label>
    <select id="fromMonth">
      <option value="1">January</option><option value="2">February</option><option value="3">March</option>
      <option value="4">April</option><option value="5">May</option><option value="6">June</option>
      <option value="7">July</option><option value="8">August</option><option value="9">September</option>
      <option value="10">October</option><option value="11">November</option><option value="12">December</option>
    </select>
  </div>
  <div class="filter-field">
    <label>&nbsp;</label>
    <select id="fromYear"></select>
  </div>

  <div class="filter-field">
    <label>To</label>
    <select id="toMonth">
      <option value="1">January</option><option value="2">February</option><option value="3">March</option>
      <option value="4">April</option><option value="5">May</option><option value="6">June</option>
      <option value="7">July</option><option value="8">August</option><option value="9">September</option>
      <option value="10">October</option><option value="11">November</option><option value="12">December</option>
    </select>
  </div>
  <div class="filter-field">
    <label>&nbsp;</label>
    <select id="toYear"></select>
  </div>
</div>

<div class="content" id="content">
  <div class="loading">Loading...</div>
</div>

<script>
  const VERIFY_WEBHOOK_URL = "https://norvelle.app.n8n.cloud/webhook/verify-code";

  async function checkGate(){
    const input = document.getElementById('gatePassword');
    const error = document.getElementById('gateError');
    const code = input.value;

    error.textContent = "Checking...";

    try {
      const res = await fetch(VERIFY_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accessCode: code })
      });
      const data = await res.json();

      if (data.valid) {
        sessionStorage.setItem('norvelleAccessCode', code);
        document.getElementById('gate').style.display = 'none';
        document.body.classList.remove('locked');
        fetchReport();
      } else {
        error.textContent = "Incorrect code";
        input.value = '';
        input.focus();
      }
    } catch (err) {
      error.textContent = "Could not verify code, try again";
    }
  }

  if (sessionStorage.getItem('norvelleAccessCode')) {
    document.getElementById('gate').style.display = 'none';
    document.body.classList.remove('locked');
  }

  const REPORT_WEBHOOK_URL = "https://norvelle.app.n8n.cloud/webhook/get-timesheet-report";
  const PROJECTS_WEBHOOK_URL = "https://norvelle.app.n8n.cloud/webhook/get-cached-projects";

  const fmtMoney = n => 'AED ' + (n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // Populate year dropdowns (current year -1 to +1)
  const thisYear = new Date().getFullYear();
  const yearSelects = [document.getElementById('fromYear'), document.getElementById('toYear')];
  yearSelects.forEach(sel => {
    for (let y = thisYear - 1; y <= thisYear + 1; y++) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      if (y === thisYear) opt.selected = true;
      sel.appendChild(opt);
    }
  });
  // Default: current month for both from/to
  document.getElementById('fromMonth').value = new Date().getMonth() + 1;
  document.getElementById('toMonth').value = new Date().getMonth() + 1;

  // Generic multi-select (chips) builder — used for both Employee and Project
  const employeeNamesAll = ["Taimour","Jayaprakash Prasad","Ramnivas Prasad","Jayan Krishnakutti","Selim Fazal Karim","Mohammad Jawdat","Omar Moner Altroude"];
  let projectNames = [];

  const selected = { employee: [], project: [] };

  function makeMultiSelect(key, inputId, chipsId, suggestionsId, getAllNames) {
    const input = document.getElementById(inputId);
    const chipsBox = document.getElementById(chipsId);
    const suggestionsBox = document.getElementById(suggestionsId);

    function renderChips() {
      chipsBox.innerHTML = selected[key].map(name => `
        <span style="display:inline-flex; align-items:center; gap:5px; background:var(--accent-dim); color:var(--accent); border-radius:6px; padding:4px 8px; font-size:12px; font-weight:600;">
          ${name}
          <span style="cursor:pointer;" onmousedown="removeSelected('${key}','${name.replace(/'/g,"\\'")}')">&#10005;</span>
        </span>
      `).join('');
    }

    function renderSuggestions() {
            const q = input.value.trim().toLowerCase();
      const all = getAllNames();
      const list = all.filter(n => !selected[key].includes(n) && (!q || n.toLowerCase().includes(q)));
      if (!list.length) { suggestionsBox.style.display = 'none'; return; }
      suggestionsBox.innerHTML = list.map(name =>
        `<div class="suggestion-item" onmousedown="addSelected('${key}','${name.replace(/'/g,"\\'")}')">${name}</div>`
      ).join('');
      suggestionsBox.style.display = 'block';
    }

    input.addEventListener('input', () => { renderSuggestions(); });
    input.addEventListener('focus', () => { renderSuggestions(); });
    input.addEventListener('click', () => { renderSuggestions(); });
    document.addEventListener('click', (e) => {
      if (!input.contains(e.target) && !suggestionsBox.contains(e.target)) {
        suggestionsBox.style.display = 'none';
      }
    });

    // expose renderers so add/remove can refresh this instance
    return { renderChips, renderSuggestions, input };
  }

  const employeeMS = makeMultiSelect('employee', 'employeeFilter', 'employeeChips', 'employeeSuggestions', () => employeeNamesAll);
  const projectMS = makeMultiSelect('project', 'projectFilter', 'projectChips', 'projectSuggestions', () => projectNames);

  window.addSelected = function(key, name) {
    selected[key].push(name);
    (key === 'employee' ? employeeMS : projectMS).renderChips();
    document.getElementById(key === 'employee' ? 'employeeFilter' : 'projectFilter').value = '';
    document.getElementById(key === 'employee' ? 'employeeSuggestions' : 'projectSuggestions').style.display = 'none';
    fetchReport();
  };

  window.removeSelected = function(key, name) {
    selected[key] = selected[key].filter(n => n !== name);
    (key === 'employee' ? employeeMS : projectMS).renderChips();
    fetchReport();
  };

  window.toggleEmployeeSuggestions = function() {
    employeeMS.renderSuggestions();
  };

  async function loadProjects() {
    try {
      const res = await fetch(PROJECTS_WEBHOOK_URL);
      const data = await res.json();
      projectNames = (data.projects || []).map(p => p.name);
    } catch (err) { console.error(err); }
  }
  loadProjects();

  // Fetch + render report
  let debounceTimer;
  function scheduleReportFetch() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(fetchReport, 300);
  }

  ['fromMonth','fromYear','toMonth','toYear'].forEach(id => {
    document.getElementById(id).addEventListener('change', fetchReport);
  });

  async function fetchReport() {
    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading">Loading...</div>';

    const params = new URLSearchParams({
      employee: selected.employee.join(','),
      project: selected.project.join(','),
      fromMonth: document.getElementById('fromMonth').value,
      fromYear: document.getElementById('fromYear').value,
      toMonth: document.getElementById('toMonth').value,
      toYear: document.getElementById('toYear').value
    });

    try {
      const res = await fetch(REPORT_WEBHOOK_URL + '?' + params.toString());
      const data = await res.json();
      renderReport(data);
    } catch (err) {
      content.innerHTML = '<div class="empty">Failed to load report</div>';
      console.error(err);
    }
  }

  function renderGroup(name, group) {
    const rows = group.entries.map(e => `
      <tr>
        <td>${e.date || '-'}</td>
        <td>${e.project}</td>
        <td>${e.workTime}</td>
        <td>${e.hours}</td>
        <td>${fmtMoney(e.cost)}</td>
      </tr>
    `).join('');

    const groupId = 'g-' + name.replace(/[^a-zA-Z0-9]/g, '');

    return `
      <div class="group-card">
        <div class="group-header" onclick="document.getElementById('${groupId}').classList.toggle('open')">
          <div class="group-name">${name}</div>
          <div class="group-totals">${group.hours}h · ${fmtMoney(group.cost)}</div>
        </div>
        <div class="group-detail" id="${groupId}">
          <table>
            <tr><th>Date</th><th>Project</th><th>Time</th><th>Hours</th><th>Cost</th></tr>
            ${rows}
          </table>
        </div>
      </div>
    `;
  }

  function renderReport(data) {
    const content = document.getElementById('content');

    if (!data.entries || !data.entries.length) {
      content.innerHTML = '<div class="empty">No entries found for this selection</div>';
      return;
    }

    const employeeGroups = Object.entries(data.byEmployee)
      .map(([name, g]) => renderGroup(name, g)).join('');

    const projectGroups = Object.entries(data.byProject)
      .map(([name, g]) => renderGroup(name, g)).join('');

    content.innerHTML = `
      <div class="summary-grid">
        <div class="summary-card">
          <div class="label">Total Hours</div>
          <div class="value">${data.grandTotalHours}</div>
        </div>
        <div class="summary-card">
          <div class="label">Total Cost</div>
          <div class="value">${fmtMoney(data.grandTotalCost)}</div>
        </div>
      </div>

      <h2>By Employee</h2>
      ${employeeGroups}

      <h2>By Project</h2>
      ${projectGroups}
    `;
  }

  if (sessionStorage.getItem('norvelleAccessCode')) {
    fetchReport();
  }
</script>

</body>
</html>
